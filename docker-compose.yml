version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hirego-web-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured}
      DIRECT_URL: ${DIRECT_URL:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be configured}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be configured}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be configured}
      WORKER_RECOVERY_API_KEY: ${WORKER_RECOVERY_API_KEY:-}
      APP_URL: ${APP_URL:?APP_URL must be configured}
      QSTASH_TOKEN: ${QSTASH_TOKEN:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?UPSTASH_REDIS_REST_URL must be configured}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?UPSTASH_REDIS_REST_TOKEN must be configured}
      RATE_LIMIT_HMAC_SECRET: ${RATE_LIMIT_HMAC_SECRET:-}
      SIEM_WEBHOOK_URL: ${SIEM_WEBHOOK_URL:-}
      SIEM_WEBHOOK_TOKEN: ${SIEM_WEBHOOK_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_GPT4O_INPUT_USD_PER_MILLION: ${OPENAI_GPT4O_INPUT_USD_PER_MILLION:-}
      OPENAI_GPT4O_OUTPUT_USD_PER_MILLION: ${OPENAI_GPT4O_OUTPUT_USD_PER_MILLION:-}
      AI_BUDGET_USD_TO_INR: ${AI_BUDGET_USD_TO_INR:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      ZEPTOMAIL_API_KEY: ${ZEPTOMAIL_API_KEY:-}
      ZEPTOMAIL_FROM_EMAIL: ${ZEPTOMAIL_FROM_EMAIL:-}
      EMAIL_CONFIG_ENCRYPTION_KEY: ${EMAIL_CONFIG_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  recovery-scheduler:
    image: node:20-alpine
    profiles: ["workers"]
    restart: unless-stopped
    user: node
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_URL: http://app:3000
      ALLOW_INTERNAL_HTTP: "1"
      WORKER_RECOVERY_API_KEY: ${WORKER_RECOVERY_API_KEY:-}
    volumes:
      - ./scripts/run-recovery-scheduler.mjs:/app/run-recovery-scheduler.mjs:ro
    command: ["node", "/app/run-recovery-scheduler.mjs"]
    depends_on: ["app"]

  postgres:
    image: postgres:16-alpine
    container_name: hirego-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
      POSTGRES_DB: ${POSTGRES_DB:-hirego_prod}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hirego_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
