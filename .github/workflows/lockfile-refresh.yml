name: Phase 4 lockfile refresh

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'phase4-production-readiness' || github.ref_name == 'phase4-production-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-production-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile from registry metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci --ignore-scripts
      - name: Commit only the generated lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "phase4: synchronize verified npm lockfile"
          git push origin HEAD:phase4-production-readiness
