name: Phase 4 lockfile refresh

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'phase4-production-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile from registry metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci --ignore-scripts
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase4-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
