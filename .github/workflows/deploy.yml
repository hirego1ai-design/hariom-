name: HireGo AI Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-build:
    name: Build, Typecheck & Validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hirego_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hirego_ci?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hirego_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hirego_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma Migrations
        run: npx prisma migrate deploy

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Suite Tests
        run: npm test
        env:
          HIREGO_TEST_DATABASE: "1"

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Next.js Standalone Production Output
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          JWT_SECRET: ci_cd_test_jwt_secret_key_32chars_2026
          INTERNAL_API_KEY: ci_cd_test_internal_api_key_32chars
