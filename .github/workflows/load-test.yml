name: Production Load Test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safe-production-load-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[load-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run safe read-only production load test
        env:
          LOAD_TEST_BASE_URL: https://www.hiregoai.com
          LOAD_TEST_TIMEOUT_MS: "10000"
        run: node scripts/load-test.mjs

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f load-test-results.json ]; then
            echo "## Production load-test result" >> "$GITHUB_STEP_SUMMARY"
            echo "```json" >> "$GITHUB_STEP_SUMMARY"
            cat load-test-results.json >> "$GITHUB_STEP_SUMMARY"
            echo "```" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload load-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-load-test-results
          path: load-test-results.json
          if-no-files-found: warn
          retention-days: 30
