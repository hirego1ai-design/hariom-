name: Production Load Test\n\non:\n  workflow_dispatch:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n\njobs:\n  safe-production-load-test:\n    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[load-test]')\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: "20"\n\n      - name: Run safe read-only production load test\n        env:\n          LOAD_TEST_BASE_URL: https://www.hiregoai.com\n          LOAD_TEST_TIMEOUT_MS: "10000"\n        run: node scripts/load-test.mjs\n\n      - name: Publish summary\n        if: always()\n        shell: bash\n        run: |\n          if [ -f load-test-results.json ]; then\n            echo "## Production load-test result" >> "$GITHUB_STEP_SUMMARY"\n            echo "```json" >> "$GITHUB_STEP_SUMMARY"\n            cat load-test-results.json >> "$GITHUB_STEP_SUMMARY"\n            echo "```" >> "$GITHUB_STEP_SUMMARY"\n          fi\n\n      - name: Upload load-test evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: production-load-test-results\n          path: load-test-results.json\n          if-no-files-found: warn\n          retention-days: 30\n