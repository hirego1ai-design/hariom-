name: Phase 5 Verification

on:
  push:
    branches: [phase5-release-operations-hardening]
  workflow_dispatch:
  pull_request:
    branches: [main]


permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma validate/generate require both datasource variables even though
      # Phase 5 offline verification must not connect to a live database.
      DATABASE_URL: postgresql://phase5:phase5@127.0.0.1:5432/phase5_verify
      DIRECT_URL: postgresql://phase5:phase5@127.0.0.1:5432/phase5_verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:phase5
      - run: npm test
      - run: npm run test:audit
      - run: npm run build
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high
