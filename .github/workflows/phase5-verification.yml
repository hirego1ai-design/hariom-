name: Phase 5 Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:


permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phase5
          POSTGRES_PASSWORD: phase5
          POSTGRES_DB: hirego_test_phase5
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase5 -d hirego_test_phase5"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Prisma validate/generate require both datasource variables even though
      # Phase 5 offline verification must not connect to a live database.
      DATABASE_URL: postgresql://phase5:phase5@127.0.0.1:5432/hirego_test_phase5
      DIRECT_URL: postgresql://phase5:phase5@127.0.0.1:5432/hirego_test_phase5
      # Explicitly authorize only this isolated CI test database for the suite guard.
      HIREGO_TEST_DATABASE: '1'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Apply isolated test migrations
        run: npx prisma migrate deploy
      - run: npm run verify:phase5
      - run: npm test
      - run: npm run test:audit
      - name: Authenticated RBAC and tenant attack matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 > /tmp/hirego-next.log 2>&1 &
          APP_PID=$!
          cleanup() { kill "$APP_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for i in {1..60}; do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/hirego-next.log
            exit 1
          fi
          BASE_URL=http://127.0.0.1:3000 npm run test:attack-matrix
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high
      - run: npm run build
